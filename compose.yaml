# Single backend service. The database is a SQLite file on the backend-data
# volume, so there is no separate database service (research R15).
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/app.db
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - backend-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  backend-data: {}

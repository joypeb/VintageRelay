# Alembic configuration for the Vintage Relay backend.

[alembic]
# Migration scripts live next to this file. %(here)s is the directory of this ini file,
# so Alembic works regardless of the current working directory.
script_location = %(here)s/alembic

# Make the backend package importable (env.py imports app.models).
prepend_sys_path = %(here)s

# Split multi-value paths with the OS path separator.
path_separator = os

# Migration file names: <revision>_<slug>.py
# file_template = %%(rev)s_%%(slug)s

# Do not run the environment for `revision`; env.py is executed for upgrade/downgrade only.
revision_environment = false

# Schema is changed only through revisions; see docs/rules/dev/backend/database.md.
# sqlalchemy.url is intentionally not set here: env.py falls back to
# Settings.database_url (DATABASE_URL) when the option is missing.

[post_write_hooks]
# Run ruff on generated revisions so they match the backend style.
hooks = ruff_check, ruff_format
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

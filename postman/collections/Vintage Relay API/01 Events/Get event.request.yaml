$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/events/{{eventId}}'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Event schema with organizer stats', () => {
        const b = pm.response.json();
        pm.expect(b).to.include.keys(['id','name','status','entryCode','entryUrl','organizerParticipantId','createdAt','closedAt','me','stats']);
        pm.expect(b.stats).to.include.keys('participantCount', 'availableClothingCount', 'confirmedExchangeCount');
      });

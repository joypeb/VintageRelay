$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/events/{{eventId}}/clothing'
order: 3000
headers:
  - key: Content-Type
    value: 'application/json; charset=utf-8'
body:
  type: json
  content: |-
    {
      "photoIds": ["{{photoId}}"],
      "description": "Duplicate tap."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 409', () => pm.response.to.have.status(409));
      pm.test('Error code is PHOTO_ALREADY_ATTACHED', () => pm.expect(pm.response.json().error.code).to.eql('PHOTO_ALREADY_ATTACHED'));

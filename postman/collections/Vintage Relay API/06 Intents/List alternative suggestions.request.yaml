$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/events/{{eventId}}/alternative-suggestions'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('List shape', () => {
        const b = pm.response.json();
        pm.expect(b.items).to.be.an('array');
        pm.expect(b.nextCursor).to.eql(null);
      });
      const items = pm.response.json().items;
      if (items.length) pm.collectionVariables.set('suggestionId', items[0].id);

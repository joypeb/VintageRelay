$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/events/{{eventId}}/intents'
order: 2000
headers:
  - key: Content-Type
    value: 'application/json; charset=utf-8'
body:
  type: json
  content: |-
    {
      "offeredClothingId": "{{clothingId}}",
      "wantedClothingId": "{{joinerClothingId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Returns the existing intent', () => pm.expect(pm.response.json().id).to.eql(pm.collectionVariables.get('intentId')));

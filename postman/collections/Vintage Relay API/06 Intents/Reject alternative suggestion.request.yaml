$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/alternative-suggestions/{{suggestionId}}/reject'
order: 7000
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.collectionVariables.get('suggestionId')) {
        console.log('Skipped: missing suggestionId');
        pm.execution.skipRequest();
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 204', () => pm.response.to.have.status(204));

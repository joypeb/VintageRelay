$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/events/{{eventId}}/intents'
order: 4000
headers:
  - key: Content-Type
    value: 'application/json; charset=utf-8'
body:
  type: json
  content: |-
    {
      "offeredClothingId": "{{joinerClothingId}}",
      "wantedClothingId": "{{clothingId}}"
    }
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{joinerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('joinerIntentId', pm.response.json().id);

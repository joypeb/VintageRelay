$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/events/{{eventId}}/intents'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('List shape', () => {
        const b = pm.response.json();
        pm.expect(b.items).to.be.an('array');
        pm.expect(b.nextCursor).to.eql(null);
      });

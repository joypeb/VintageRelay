$kind: http-request
method: PATCH
url: '{{baseUrl}}/api/v1/clothing/{{clothingId}}'
order: 3000
headers:
  - key: Content-Type
    value: 'application/json; charset=utf-8'
body:
  type: json
  content: |-
    {
      "description": "Not mine."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 403', () => pm.response.to.have.status(403));
      pm.test('Error code is FORBIDDEN', () => pm.expect(pm.response.json().error.code).to.eql('FORBIDDEN'));

$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/events/{{eventId}}/photos'
order: 1000
body:
  type: formdata
  content:
    - key: file
      type: file
      src: 'postman/fixtures/sample.png'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('joinerPhotoId', pm.response.json().id);

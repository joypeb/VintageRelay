$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/events/{{eventId}}/clothing'
order: 2000
headers:
  - key: Content-Type
    value: 'application/json; charset=utf-8'
body:
  type: json
  content: |-
    {
      "photoId": "{{joinerPhotoId}}",
      "description": "White wide pants, size 28."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('joinerClothingId', pm.response.json().id);

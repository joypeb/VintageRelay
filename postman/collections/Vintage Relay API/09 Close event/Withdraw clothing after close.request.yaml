$kind: http-request
method: DELETE
url: '{{baseUrl}}/api/v1/clothing/{{clothingId}}'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 409', () => pm.response.to.have.status(409));
      pm.test('Error code is EVENT_CLOSED', () => pm.expect(pm.response.json().error.code).to.eql('EVENT_CLOSED'));

$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/events/{{eventId}}'
order: 1000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 401', () => pm.response.to.have.status(401));
      pm.test('Error code is UNAUTHENTICATED', () => pm.expect(pm.response.json().error.code).to.eql('UNAUTHENTICATED'));

$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/events/{{eventId}}/close'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{joinerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 403', () => pm.response.to.have.status(403));
      pm.test('Error code is FORBIDDEN', () => pm.expect(pm.response.json().error.code).to.eql('FORBIDDEN'));

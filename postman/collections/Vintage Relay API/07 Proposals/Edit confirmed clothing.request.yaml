$kind: http-request
method: PATCH
url: '{{baseUrl}}/api/v1/clothing/{{clothingId}}'
order: 7000
headers:
  - key: Content-Type
    value: 'application/json; charset=utf-8'
body:
  type: json
  content: |-
    {
      "description": "Changed after confirmation."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 409', () => pm.response.to.have.status(409));
      pm.test('Error code is CLOTHING_ALREADY_CONFIRMED', () => pm.expect(pm.response.json().error.code).to.eql('CLOTHING_ALREADY_CONFIRMED'));

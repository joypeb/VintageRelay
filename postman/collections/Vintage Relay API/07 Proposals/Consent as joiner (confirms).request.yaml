$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/proposals/{{proposalId}}/consents'
order: 6000
headers:
  - key: Content-Type
    value: 'application/json; charset=utf-8'
body:
  type: json
  content: |-
    {
      "version": "{{proposalVersionNumber}}"
    }
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{joinerToken}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.collectionVariables.get('proposalId')) {
        console.log('Skipped: missing proposalId');
        pm.execution.skipRequest();
      }
      pm.variables.set('proposalVersionNumber', Number(pm.collectionVariables.get('proposalVersion')));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Exchange confirmed', () => {
        pm.expect(b.status).to.eql('confirmed');
        pm.expect(b.confirmedAt).to.be.a('string');
        pm.expect(b.canCancel).to.eql(true);
      });

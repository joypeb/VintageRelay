$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/proposals/{{proposalId}}/cancel'
order: 10000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{joinerToken}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.collectionVariables.get('proposalId')) {
        console.log('Skipped: missing proposalId');
        pm.execution.skipRequest();
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
